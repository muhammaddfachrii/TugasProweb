<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Daftar</title>
</head>
<body>
  <form name="formdaftar">
    <label for="uname">Username</label>
    <input type="text" name="username" size="30" id="uname">
    <label for="pass">Password</label>
    <input type="password" name="password" size="30" id="pass">
    <button type="button" onclick="proses()" name="btnSubmit">Daftar</button>
    <button type="reset">Reset</button>
  </form>

  <script>
    function proses() {
      let username = document.formdaftar.username.value;
      let password = document.formdaftar.password.value;
      alert("Anda Memasukkan Data:\nUsername: " + username + "\nPassword: " + password);
    }
  </script>
</body>
</html>
